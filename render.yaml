services:
  - type: web
    name: quantum-banking-qiskit
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://rifqironanda.github.io
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
