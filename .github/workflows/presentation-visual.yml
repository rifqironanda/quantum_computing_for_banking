name: Presentation visual validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run presentation checks and capture screenshots
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:5173/quantum_computing_for_banking/ > /dev/null && break; sleep 1; done
          cat > visual-check.mjs <<'JS'
          import { chromium } from 'playwright';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { slides } from './src/slides.js';
          mkdirSync('visual-results', { recursive: true });
          const browser = await chromium.launch();
          const page = await browser.newPage();
          const errors = [], failures = [], results = [];
          page.on('pageerror', e => errors.push(e.message));
          for (const [width,height] of [[1366,768],[1920,1080],[768,1024],[390,844],[844,390]]) {
           await page.setViewportSize({width,height});
           await page.goto('http://127.0.0.1:5173/quantum_computing_for_banking/#slide-1');
           await page.locator('.slide-content').waitFor();
           await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important}'});
           for (const fullscreen of [false,true]) {
            if(fullscreen) { await page.getByRole('button',{name:'Layar penuh',exact:true}).click(); await page.waitForFunction(()=>!!document.fullscreenElement); }
            for(let i=1;i<=slides.length;i++) {
             await page.evaluate(i=>{location.hash='slide-'+i},i);
             await page.waitForFunction(i=>document.querySelector('.counter')?.textContent.startsWith(i+' /'),i);
             await page.mouse.move(0,0);
          await page.evaluate(()=>document.fonts.ready);
          const card=page.locator('.learning-card').first();
             if(await card.count()) await card.click();
             const evidence=page.locator('.evidence-hint button');
             if(await evidence.count()) await evidence.click();
             await page.evaluate(()=>document.querySelector('.slide-stage').scrollTo(0,0));
             const metrics=await page.evaluate(()=>{
              const stage=document.querySelector('.slide-stage'),slide=document.querySelector('.slide'),content=document.querySelector('.slide-content'),footer=slide.querySelector('footer'),controls=document.querySelector('.controls');
              const b=content.getBoundingClientRect(),f=footer.getBoundingClientRect(),s=stage.getBoundingClientRect(),c=controls.getBoundingClientRect();
              const overflow=[...content.querySelectorAll('*')].filter(e=>{
               if(e.closest('.table-wrap') || e.matches('svg,svg *') || !e.getClientRects().length) return false;
               const r=e.getBoundingClientRect();
               return e.textContent.trim() && r.width>0 && (r.right>slide.getBoundingClientRect().right+2 || r.left<slide.getBoundingClientRect().left-2);
              }).map(e=>e.className).slice(0,8);
              return {horizontal:stage.scrollWidth>stage.clientWidth+2,footerOverlap:b.bottom>f.top+1,controlsOverlap:s.bottom>c.top+1,clipped:slide.scrollHeight>slide.clientHeight+2,fullscreen:!!document.fullscreenElement,overflow,scrollable:stage.scrollHeight>stage.clientHeight+2};
             });
             const row={width,height,fullscreen,slide:i,kind:slides[i-1].kind,...metrics};results.push(row);
          writeFileSync('visual-results/report.json',JSON.stringify({tested:results.length,errors,failures,results},null,2));
             if(metrics.horizontal||metrics.footerOverlap||metrics.controlsOverlap||metrics.clipped||metrics.overflow.length||metrics.fullscreen!==fullscreen) failures.push(row);
             await page.screenshot({path:'visual-results/'+width+'x'+height+'-'+(fullscreen?'full':'window')+'-'+i+'.png'});
             if(metrics.scrollable) {
              await page.evaluate(()=>{const s=document.querySelector('.slide-stage');s.scrollTop=s.scrollHeight});
              await page.screenshot({path:'visual-results/'+width+'x'+height+'-'+(fullscreen?'full':'window')+'-'+i+'-bottom.png'});
             }
            }
            if(fullscreen) { await page.evaluate(()=>document.exitFullscreen()); await page.waitForFunction(()=>!document.fullscreenElement); }
           }
          }
          writeFileSync('visual-results/report.json',JSON.stringify({tested:results.length,errors,failures,results},null,2));
          console.log(JSON.stringify({tested:results.length,errors,failures}));
          await browser.close();
          if(errors.length||failures.length) process.exitCode=1;
          
          JS
          node visual-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-visual-results
          path: visual-results/
          retention-days: 7
